name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip PhotoSync_Android.zip

      - name: Show extracted structure
        run: find . -maxdepth 3 -type f -name "gradlew" 

      - name: Copy google-services.json
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -1)
          PROJECT_DIR=$(dirname $GRADLEW_PATH)
          cp google-services.json $PROJECT_DIR/app/google-services.json
          echo "Project dir: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -1)
          PROJECT_DIR=$(dirname $GRADLEW_PATH)
          chmod +x $GRADLEW_PATH
          cd $PROJECT_DIR
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
