name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip PhotoSync_Android.zip

      - name: Copy google-services.json
        run: cp google-services.json PhotoSync/app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x PhotoSync/gradlew

      - name: Build Debug APK
        run: |
          cd PhotoSync
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-debug
          path: PhotoSync/app/build/outputs/apk/debug/app-debug.apk
