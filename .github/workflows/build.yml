name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip PhotoSync_Android_v9.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          chmod +x PhotoSync/gradlew
          cd PhotoSync
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | head -150

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSync-debug
          path: "**/app-debug.apk"
